<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>原版正视图参考</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar">
        <header>
          <h1>原版正视图参考</h1>
          <output id="meta">读取中</output>
        </header>

        <section class="panel">
          <label>
            <span>头发</span>
            <select id="hairSelect"></select>
          </label>
          <label>
            <span>衣服</span>
            <select id="outfitSelect"></select>
          </label>
          <label class="check-row">
            <input id="includeWalk" type="checkbox" />
            <span>显示 walk 正面</span>
          </label>
          <button id="copyUrlButton" type="button">复制当前链接</button>
        </section>

        <section class="panel notes">
          <strong>当前组合</strong>
          <output id="comboName"></output>
          <strong>动作</strong>
          <output id="actionList"></output>
        </section>
      </aside>

      <section class="content">
        <div id="grid" class="grid"></div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RPG Dress-Up Studio</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="dressup-shell">
      <section class="closet-panel">
        <header class="app-title">
          <div>
            <p class="eyebrow">RPG Sprite Wardrobe</p>
            <h1>换装试衣间</h1>
          </div>
          <span class="status-pill" id="loadStatus">Loading</span>
        </header>

        <div class="asset-meter" id="assetCount">读取素材中</div>

        <section class="picker-section">
          <div class="section-head">
            <span>发型</span>
            <button class="mini-button" id="randomHairButton" type="button">随机</button>
          </div>
          <div class="choice-grid hair-grid" id="hairGrid"></div>
        </section>

        <section class="picker-section">
          <div class="section-head">
            <span>服装</span>
            <button class="mini-button" id="randomOutfitButton" type="button">随机</button>
          </div>
          <div class="choice-grid outfit-grid" id="outfitGrid"></div>
        </section>
      </section>

      <section class="stage-panel">
        <div class="stage-topbar">
          <div class="identity-card">
            <span id="lookName">-</span>
            <strong id="actionName">-</strong>
          </div>
          <div class="topbar-actions">
            <button class="primary-button" id="playButton" type="button">播放</button>
            <button class="ghost-button" id="randomLookButton" type="button">随机换装</button>
          </div>
        </div>

        <div class="runway-wrap" id="stageWrap">
          <div class="runway">
            <div class="sprite-stage" id="stage">
              <img class="sprite-layer" id="spriteLayer" alt="" draggable="false" />
            </div>
            <div class="shadow-oval"></div>
          </div>
        </div>

        <div class="direction-dock" id="directionGroup" aria-label="方向"></div>

        <section class="filmstrip-card">
          <div class="filmstrip-head">
            <span>当前方向动作帧</span>
            <small id="stageCaption"></small>
          </div>
          <div class="frame-strip" id="frameStrip"></div>
        </section>
      </section>

      <section class="action-panel">
        <section class="picker-section compact">
          <div class="section-head">
            <span>动作</span>
            <small>6 组动作</small>
          </div>
          <div class="action-grid" id="actionGrid"></div>
        </section>

        <section class="picker-section compact">
          <div class="section-head">
            <span>帧</span>
            <small id="frameRangeLabel">pose 01-04</small>
          </div>
          <div class="frame-tabs" id="frameGroup" aria-label="帧"></div>
        </section>

        <section class="picker-section compact">
          <div class="section-head">
            <span>播放设置</span>
          </div>
          <label class="range-row">
            <span>缩放</span>
            <input id="zoomInput" type="range" min="1" max="4" step="0.25" />
            <output id="zoomValue"></output>
          </label>
          <label class="range-row">
            <span>速度</span>
            <input id="speedInput" type="range" min="80" max="360" step="10" />
            <output id="speedValue"></output>
          </label>
        </section>

        <section class="matrix-card">
          <div class="section-head">
            <span>动作展示</span>
            <small id="matrixRangeLabel">4 方向 × 4 帧</small>
          </div>
          <div class="pose-matrix" id="poseMatrix"></div>
        </section>

        <section class="sheet-card">
          <div class="section-head">
            <span>Spritesheet</span>
            <small id="sheetLabel"></small>
          </div>
          <div class="sheet-preview">
            <img id="sheetImage" alt="" draggable="false" />
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Action Sheet Manual Crop</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="panel panel-left">
        <div class="panel-head">
          <div>
            <h1>动作表手动审核</h1>
            <span id="assetCount" class="asset-count">读取中</span>
          </div>
          <a class="small-link" href="../hair-dressup-review/index.html">Demo</a>
        </div>

        <section class="control-section">
          <div class="section-label">筛选</div>
          <label class="select-row">
            <span>发型</span>
            <select id="hairFilter"></select>
          </label>
          <label class="select-row">
            <span>衣服</span>
            <select id="outfitFilter"></select>
          </label>
          <label class="select-row">
            <span>动作</span>
            <select id="actionFilter"></select>
          </label>
          <label class="file-row">
            <span>本地表</span>
            <input id="localFileInput" type="file" accept="image/png,image/webp,image/jpeg" multiple />
          </label>
          <div class="local-source-list" id="localSourceList"></div>
        </section>

        <section class="control-section sheet-list-section">
          <div class="section-label">动作表</div>
          <div class="sheet-list" id="sheetList"></div>
        </section>
      </aside>

      <section class="viewer-surface">
        <div class="toolbar">
          <button id="prevButton" class="tool-button" type="button">上一张</button>
          <button id="nextButton" class="tool-button" type="button">下一张</button>
          <button id="nextUncheckedButton" class="tool-button" type="button">下一张未审核</button>
          <div class="toolbar-group" id="quickFrameGroup"></div>
          <label class="toolbar-field">
            <span>缩放</span>
            <input id="zoomInput" type="range" min="0.35" max="1.5" step="0.05" value="0.62" />
            <output id="zoomValue">0.62x</output>
          </label>
          <label class="toolbar-field compact-field">
            <span>底色</span>
            <select id="previewBgSelect">
              <option value="checker">棋盘</option>
              <option value="black">黑色</option>
              <option value="green">绿幕</option>
              <option value="white">白色</option>
            </select>
          </label>
          <span class="current-title" id="currentTitle"></span>
        </div>

        <div class="canvas-wrap">
          <canvas id="sheetCanvas" width="1254" height="1254"></canvas>
        </div>

        <div class="focus-preview">
          <canvas id="focusCanvas" width="314" height="314"></canvas>
          <div class="focus-meta">
            <strong id="focusTitle">front / pose_01</strong>
            <span id="focusCropText">314x314</span>
          </div>
        </div>

        <div class="preview-grid" id="previewGrid"></div>
      </section>

      <aside class="panel panel-right">
        <section class="control-section notice-section">
          <div class="section-label">规则</div>
          <p>红线决定源图切片边界，裁出的内容会居中放回 314x314 单帧。导出只写下载文件，不会直接覆盖素材库。</p>
        </section>

        <section class="control-section">
          <div class="section-label">抠图</div>
          <label class="toggle-row">
            <input id="greenKeyToggle" type="checkbox" checked />
            <span>保守抠纯绿</span>
          </label>
          <label class="select-row">
            <span>G 最低</span>
            <input id="greenMinInput" type="number" min="0" max="255" step="1" value="235" />
          </label>
          <label class="select-row">
            <span>RB 最高</span>
            <input id="redBlueMaxInput" type="number" min="0" max="255" step="1" value="36" />
          </label>
          <label class="select-row">
            <span>色差</span>
            <input id="greenGapInput" type="number" min="0" max="255" step="1" value="170" />
          </label>
        </section>

        <section class="control-section">
          <div class="section-label">X 边界</div>
          <div class="edge-grid" id="xEdgeGrid"></div>
        </section>

        <section class="control-section">
          <div class="section-label">Y 边界</div>
          <div class="edge-grid" id="yEdgeGrid"></div>
        </section>

        <section class="control-section">
          <div class="section-label">人体比例线</div>
          <p class="mini-help">按输出单帧 314 高度标注：头顶、脚底。会叠到每个小格上，方便先看人物整体高度和落脚线。</p>
          <div class="landmark-grid" id="landmarkGrid"></div>
          <button id="resetLandmarkButton" class="wide-button" type="button">重置人体线</button>
        </section>

        <section class="control-section">
          <div class="section-label">预设</div>
          <div class="button-grid">
            <button id="equalPresetButton" class="wide-button" type="button">等分边界</button>
            <button id="round314PresetButton" class="wide-button" type="button">314 格线</button>
            <button id="resetButton" class="wide-button" type="button">重置本张</button>
          </div>
        </section>

        <section class="control-section">
          <div class="section-label">保存</div>
          <label class="select-row">
            <span>状态</span>
            <select id="statusSelect">
              <option value="unchecked">未审核</option>
              <option value="ok">可用</option>
              <option value="needs_fix">要修</option>
              <option value="regen">重生成</option>
            </select>
          </label>
          <div class="issue-box">
            <div class="issue-title">问题标记</div>
            <label><input type="checkbox" value="bad_crop" data-issue /> 裁剪多/少</label>
            <label><input type="checkbox" value="wrong_pose" data-issue /> 动作/方向错</label>
            <label><input type="checkbox" value="bad_hair" data-issue /> 头发问题</label>
            <label><input type="checkbox" value="bad_outfit" data-issue /> 衣服问题</label>
            <label><input type="checkbox" value="bad_eye" data-issue /> 眼睛问题</label>
            <label><input type="checkbox" value="bad_landmark_alignment" data-issue /> 人体比例线不齐</label>
            <label><input type="checkbox" value="artifact" data-issue /> 杂点/破图</label>
          </div>
          <div class="frame-mark-box">
            <strong>单帧标记</strong>
            <span>点击底部 16 个预览小格，可以圈出具体有问题的帧。</span>
            <output id="frameMarkSummary">已标记 0 帧</output>
          </div>
          <label class="note-label">
            <span>备注</span>
            <textarea id="noteInput" spellcheck="false"></textarea>
          </label>
          <button id="saveButton" class="wide-button primary-button" type="button">保存本张参数</button>
          <button id="downloadFrameButton" class="wide-button" type="button">下载当前单帧</button>
          <button id="downloadZipButton" class="wide-button" type="button">下载本张 16 帧 ZIP</button>
          <button id="markRegenButton" class="wide-button danger-button" type="button">标记重生成并保存</button>
          <button id="clearFrameMarksButton" class="wide-button" type="button">清除本张单帧标记</button>
          <button id="copyCurrentButton" class="wide-button" type="button">复制本张 JSON</button>
          <button id="copyAllButton" class="wide-button" type="button">复制全部已保存</button>
          <button id="copyIssuesButton" class="wide-button" type="button">复制问题清单</button>
          <output id="saveState" class="save-state"></output>
        </section>

        <section class="control-section">
          <div class="section-label">当前 JSON</div>
          <textarea id="jsonOutput" spellcheck="false"></textarea>
        </section>
      </aside>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
